title: Hyun Dev Blog
description: Backend Study Log — Spring · DevOps · Algorithm · CS
url: "https://hyun7en.github.io"
baseurl: ""

author:
  name: Hyun
  bio: Backend Developer — Java, Spring, DevOps
  github: Hyun7en

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Plugins (GitHub Pages 지원 플러그인)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
nav:
  - title: Home
    url: /
  - title: Categories
    url: /categories/
  - title: Tags
    url: /tags/
  - title: About
    url: /about/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_KO.md
  - .gitignore
  - vendor/
