---
layout: default
---

<div class="page-header">
  <h1>{{ page.title }}</h1>
  <p>태그별 포스트 목록</p>
</div>

{% for tag in site.tags %}
  <section class="category-section" id="{{ tag[0] | slugify }}">
    <h2># {{ tag[0] }} <span style="font-size:14px;color:#64748b;font-weight:400;">({{ tag[1].size }})</span></h2>
    <ul class="category-post-list">
      {% for post in tag[1] %}
        <li>
          <a href="{{ post.url }}">{{ post.title }}</a>
          <span class="post-date">{{ post.date | date: "%Y.%m.%d" }}</span>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endfor %}
